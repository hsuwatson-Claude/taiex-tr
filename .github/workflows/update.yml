name: 每日更新報酬指數

on:
  schedule:
    - cron: "0 7 * * 1-5"   # UTC 07:00 = 台北 15:00（收盤 13:30 後 90 分鐘），週一到週五
  workflow_dispatch:         # 也可以在 GitHub 網頁上手動按「Run workflow」

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update.py
      - name: 有新資料才 commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add taiex_total_return_daily.csv
          git diff --cached --quiet || git commit -m "資料更新 $(tail -1 taiex_total_return_daily.csv | cut -d, -f1)"
          git push
